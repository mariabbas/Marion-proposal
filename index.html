<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Little Question</title>
<style>
:root{--bg:#fff7fb;--ink:#59465b;--pink:#f6bfd4;--lav:#d9c8f4;--white:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#ffe5ef,transparent 32%),radial-gradient(circle at 85% 85%,#e9ddff,transparent 34%),var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);overflow:hidden}
.card{width:min(100%,440px);padding:42px 26px 32px;background:#ffffffc9;border:1px solid #fff;border-radius:28px;box-shadow:0 18px 55px #b79ab52b;text-align:center;backdrop-filter:blur(8px);position:relative}
.decor{font-size:24px;letter-spacing:12px;opacity:.7;margin-bottom:16px;animation:float 3s ease-in-out infinite}.question{font-family:Georgia,serif;font-size:clamp(26px,7vw,38px);line-height:1.2;margin:8px 0 12px}.sub{font-size:14px;opacity:.72;margin-bottom:28px}
.buttons{display:flex;justify-content:center;align-items:center;gap:16px;min-height:54px;position:relative;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:14px 28px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .18s,box-shadow .18s;background:var(--pink);color:#694457;box-shadow:0 5px 0 #e8a7c0}.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #e8a7c0}.yes{background:var(--lav);color:#594b76;box-shadow:0 5px 0 #c4afe9}.yes:hover{box-shadow:0 7px 0 #c4afe9}.no{background:#f4d9e5;box-shadow:0 5px 0 #dfbacb}.message{display:none;margin-top:26px;font-size:18px;line-height:1.5}.message.show{display:block;animation:pop .35s ease}.small{font-size:12px;opacity:.58;margin-top:20px}
@keyframes float{50%{transform:translateY(-7px)}}@keyframes pop{0%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:scale(1)}}
</style></head><body>
<main class="card" aria-live="polite"><div class="decor">✦ ♡ ✧</div><h1 class="question">Would you like to continue?</h1><p class="sub">Choose whichever feels right. ✨</p>
<div class="buttons" id="buttons"><button class="btn yes" id="yes">YES ✨</button><button class="btn no" id="no">NO 🙈</button></div>
<div class="message" id="message"></div><div class="small">A little interactive page</div></main>
<script>
const noBtn=document.getElementById('no'), yesBtn=document.getElementById('yes'), buttons=document.getElementById('buttons'), msg=document.getElementById('message');
noBtn.addEventListener('click',()=>{noBtn.style.position='fixed';noBtn.style.zIndex='10';const pad=18;const maxX=Math.max(pad,window.innerWidth-noBtn.offsetWidth-pad);const maxY=Math.max(pad,window.innerHeight-noBtn.offsetHeight-pad);noBtn.style.left=Math.round(pad+Math.random()*(maxX-pad))+'px';noBtn.style.top=Math.round(pad+Math.random()*(maxY-pad))+'px';noBtn.style.transform='rotate('+((Math.random()*14)-7)+'deg)';noBtn.textContent=['NO 🙈','Oops! 😅','Over here! ✨'][Math.floor(Math.random()*3)];});
yesBtn.addEventListener('click',()=>{msg.textContent='Thanks for choosing! ✨';msg.classList.add('show');yesBtn.disabled=true;yesBtn.style.opacity='.65';noBtn.style.display='none';});
</script></body></html>
