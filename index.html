<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff7fb"><title>A Little Note</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    :root{--bg:#fff7fb;--ink:#59465b;--pink:#f6bfd4;--lav:#d9c8f4;--muted:#806f82}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;color:var(--ink);background:radial-gradient(circle at 15% 15%,#ffe5ef,transparent 32%),radial-gradient(circle at 85% 85%,#e9ddff,transparent 34%),var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .card{width:min(100%,470px);padding:34px 25px;text-align:center;background:#ffffffdf;border:1px solid white;border-radius:28px;box-shadow:0 18px 55px #b79ab52b;backdrop-filter:blur(8px)}
    .decor{margin-bottom:14px;font-size:25px;letter-spacing:10px;opacity:.75;animation:float 3s ease-in-out infinite}h1{margin:8px 0 12px;font:600 clamp(27px,7vw,38px)/1.2 Georgia,serif}.intro{margin:0 0 24px;color:var(--muted);font-size:14px;line-height:1.6}
    .video-wrap{margin:22px 0;overflow:hidden;border-radius:18px;background:#f4edf7}video{display:block;width:100%;max-height:430px;background:#f4edf7}
    form{margin-top:22px;text-align:left}label{display:block;margin:0 0 8px;font-size:14px;font-weight:650}textarea{display:block;width:100%;min-height:105px;resize:vertical;padding:13px 14px;color:var(--ink);font:inherit;border:1px solid #eaddec;border-radius:14px;background:#fff;outline:none}textarea:focus{border-color:#c5a9e9;box-shadow:0 0 0 3px #d9c8f455}
    .submit-row{margin-top:13px;text-align:center}button{border:0;border-radius:999px;padding:13px 23px;color:#594b76;background:var(--lav);box-shadow:0 5px 0 #c4afe9;font-size:15px;font-weight:700;cursor:pointer;transition:transform .18s,opacity .18s}button:hover{transform:translateY(-2px)}button:disabled{cursor:wait;opacity:.65}.status{min-height:24px;margin:15px 0 0;text-align:center;font-size:14px;line-height:1.5}.foot{margin:22px 0 0;color:#99899b;font-size:12px}@keyframes float{50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="card">
    <div class="decor" aria-hidden="true">✦ ♡ ✧</div>
    <h1>A Little question</h1>
    <p class="intro">Will you marry me?</p>

    <div class="buttons" id="buttons">
    <button class="btn yes" id="yes">YES ✨</button>
    <button class="btn no" id="no">NO 🙈</button>
  </div>
  </main>
  <main class="card" id="video-page" hidden>
  <div class="decor">✦ ♡ ✧</div>

  <h1>Thank you! 💜</h1>
  <p class="intro">Here's a little video for you.</p>

  <div class="video-wrap">
    <video id="cute-video" controls playsinline>
      <source src="cute-video.mp4" type="video/mp4">
    </video>
  </div>

  <button class="btn yes" id="back">Back</button>

    <form id="feedback-form">
      <label for="feedback">Would you like to share your vows?</label>
      <textarea id="feedback" name="feedback" maxlength="2000" placeholder="Write your message here…" required></textarea>
      <div class="submit-row"><button id="send-button" type="submit">Send message ✨</button></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="foot">Made with care · You can edit this text in index.html</p>
  </main>

  <script>
    /*
      EMAILJS CONFIGURATION
      EmailJS template must have {{choice}} and {{submitted_at}} variables.
      Set the template's recipient to the inbox where you want messages delivered.
    */
    const EMAILJS_PUBLIC_KEY = "s2a_eSK1LXLCbTx3J";
    const EMAILJS_SERVICE_ID = "service_41i882r";
    const EMAILJS_TEMPLATE_ID = "template_mcx53bk";
    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

    const form = document.getElementById("feedback-form");
    const sendButton = document.getElementById("send-button");
    const statusMessage = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = document.getElementById("feedback").value.trim();
      if (!message) { statusMessage.textContent = "Please write a message before sending."; return; }
      sendButton.disabled = true;
      statusMessage.textContent = "Sending your message…";
      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          choice: message,
          submitted_at: new Date().toLocaleString()
        });
        statusMessage.textContent = "Your message was sent successfully. Thank you!";
        form.reset();
      } catch (error) {
        console.error("EmailJS error:", error);
        statusMessage.textContent = "Message could not be sent. Check your EmailJS template settings and try again.";
      } finally { sendButton.disabled = false; }
    });
  </script>
</body>
</html>
